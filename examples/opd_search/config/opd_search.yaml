defaults:
  - /ppo_trainer
  - _self_

hydra:
  searchpath:
    - file://${oc.env:OPD_REPO_ROOT}/verl/trainer/config

data:
  train_files: /data/work/YingZhong/data/nq_hotpotqa_opd/train.parquet
  val_files: /data/work/YingZhong/data/nq_hotpotqa_opd/test.parquet
  train_batch_size: 512
  max_prompt_length: 2048
  max_response_length: 8192
  filter_overlong_prompts: true
  truncation: error
  shuffle: true

actor_rollout_ref:
  model:
    path: Qwen/Qwen2.5-3B
    custom_chat_template: "{{ messages[0]['content'] }}"
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    optim:
      lr: 1.0e-6
    ppo_mini_batch_size: 512
    ppo_epochs: 1
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 12288
    loss_agg_mode: token-mean
    use_kl_loss: true
    kl_loss_type: low_var_kl
    kl_loss_coef: 0.001
    entropy_coeff: 0.0
    fsdp_config:
      param_offload: true
      optimizer_offload: true
  ref:
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 12288
    fsdp_config:
      param_offload: true
  rollout:
    name: vllm
    n: 8
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.5
    max_model_len: 10241
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 12288
    calculate_log_probs: true
    agent:
      default_agent_loop: opd_search_agent
      agent_loop_config_path: ${oc.env:OPD_REPO_ROOT}/examples/opd_search/config/agent_loops.yaml

distillation:
  enabled: true
  nnodes: 1
  n_gpus_per_node: 2
  teacher_models:
    teacher_model:
      key: search_qa
      model_path: Qwen/Qwen2.5-7B-Instruct
      inference:
        name: vllm
        tensor_model_parallel_size: 1
        gpu_memory_utilization: 0.7
        max_model_len: 10241
  distillation_loss:
    loss_mode: opd_search_forward_kl
    use_task_rewards: false
    use_policy_gradient: false
    distillation_loss_coef: 1.0
    importance_ratio_min: 1.0e-6
    importance_ratio_max: 10.0
    loss_max_clamp: null
    log_prob_min_clamp: null

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false

reward:
  custom_reward_function:
    path: ${oc.env:OPD_REPO_ROOT}/examples/opd_search/reward.py
    name: compute_score

trainer:
  use_v1: true
  v1:
    trainer_mode: sync
  n_gpus_per_node: 4
  nnodes: 1
  logger: [console, wandb]
  project_name: ${oc.env:WANDB_PROJECT,opd_search}
  experiment_name: ${oc.env:WANDB_NAME,qwen25_7b_instruct_to_3b_base}
  log_val_generations: 2
  total_epochs: 15
  total_training_steps: 420
  # Checkpoint and validation use the same global-step interval.
  save_freq: ${trainer.test_freq}
  test_freq: 50
  val_before_train: true
  default_local_dir: ${oc.env:OPD_REPO_ROOT}/checkpoints/opd_search
  rollout_data_dir: ${trainer.default_local_dir}/rollouts
  validation_data_dir: ${trainer.default_local_dir}/validation

opd_search:
  url: http://127.0.0.1:8000/retrieve
  topk: 3
  max_search_turns: 4
  max_generation_tokens: 512
  max_observation_tokens: 512
  timeout: 60.0
  retries: 2
